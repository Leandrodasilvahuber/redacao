# Configuração usada só pelos testes (perfil "test"): banco H2 em memória isolado por execução
# (nunca toca no arquivo ./data/orquestrador usado pelo app de verdade) e chaves fake pras
# propriedades que não têm valor padrão em application.properties.
spring.datasource.url=jdbc:h2:mem:orquestrador-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

groq.api-key=teste-groq-key
gemini.api-key=teste-gemini-key
mistral.api-key=teste-mistral-key
