spring.application.name=orquestrador-ia

groq.api-key=${GROQ_API_KEY}
groq.base-url=https://api.groq.com/openai/v1
groq.model=openai/gpt-oss-120b

# Limites REAIS do plano gratuito do Groq para o modelo acima (console.groq.com/settings/limits).
# O app so usa metade disso na pratica - o fator de seguranca de 50% esta fixo em codigo
# (GroqRateLimiter.FATOR_SEGURANCA), entao alterar estes valores nunca ultrapassa a metade do plano real.
groq.limite.requisicoes-por-minuto=30
groq.limite.requisicoes-por-dia=1000
groq.limite.tokens-por-minuto=12000
groq.limite.tokens-por-dia=100000

gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-flash-lite-latest

# Limites REAIS do plano gratuito do Gemini para o modelo acima (aistudio.google.com, painel de limites).
# O app so usa metade disso na pratica - o fator de seguranca de 50% esta fixo em codigo
# (GeminiRateLimiter.FATOR_SEGURANCA), entao alterar estes valores nunca ultrapassa a metade do plano real.
gemini.limite.requisicoes-por-minuto=5
gemini.limite.requisicoes-por-dia=20
gemini.limite.tokens-por-minuto=250000
gemini.limite.tokens-por-dia=250000

mistral.api-key=${MISTRAL_API_KEY}
mistral.base-url=https://api.mistral.ai/v1
mistral.model=mistral-small-latest

# Credito gratuito do plano free do Mistral e preco por milhao de tokens do modelo acima
# (mistral.ai/pricing/api). O app so usa metade do credito na pratica - o fator de seguranca
# de 50% esta fixo em codigo (MistralOrcamentoLimiter.FATOR_SEGURANCA).
mistral.orcamento.credito-usd=10.00
mistral.orcamento.preco-entrada-por-milhao=0.15
mistral.orcamento.preco-saida-por-milhao=0.60

linkedin.client-id=${LINKEDIN_CLIENT_ID:}
linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8080/linkedin/callback}
linkedin.frontend-url=${LINKEDIN_FRONTEND_URL:http://localhost:5180}
# Versao da API versionada do LinkedIn (formato AAAAMM). Atualizar periodicamente
# conforme https://learn.microsoft.com/linkedin/marketing/versioning
linkedin.api-version=${LINKEDIN_API_VERSION:202608}

blog.api-url=${BLOG_API_URL:https://leandrohuber.duckdns.org}
blog.api-token=${BLOG_API_TOKEN:}

spring.datasource.url=jdbc:h2:file:./data/orquestrador
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

rss.feeds=https://www.tecmundo.com.br/rss,https://canaltech.com.br/rss/,https://olhardigital.com.br/feed/
selecao.limite-diario=10
